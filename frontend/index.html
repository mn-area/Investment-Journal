<!DOCTYPE html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investment Journal</title>
  </head>
  <body>
    <!-- <header>
      <h1>Investment Journal</h1>
    </header> -->
    <main>
      <div id="app" class="all-area">
        <div class="navbar bg-base-100">
          <div class="navbar-start">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-10 text-accent">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941" />
            </svg>
            <div class="navbar-text">
              <h1 class="text-xl font-bold">投資記録一覧</h1>
              <small>株式の売買履歴を記録・管理します</small>
            </div>
          </div>
          <div class="navbar-end">
            <button id="open-trade-btn" class="btn btn-outline btn-accent">取引登録</button>
          </div>
        </div>
          <div id="toast" class="toast toast-top toast-center animation hidden">
            <div class="alert alert-success">
              <span>Message sent successfully.</span>
            </div>
          </div>
        <div class="summary-area">
          <div class="flex items-center justify-between p-5 bg-white rounded shadow-sm">
            <div class="text-gray-400 mr-5">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-icon lucide-list size-10">
                <path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/>
              </svg>
            </div>
            <div>
                <div class="text-sm text-gray-400 ">取引件数</div>
                <div class="items-center pt-1">
                    <div id="trade-count" class="text-xl font-medium text-black-400"></div>
                </div>
            </div>
          </div>
          <div class="flex items-center justify-between p-5 bg-white rounded shadow-sm">
            <div class="text-green-400 mr-5">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-banknote-arrow-down-icon lucide-banknote-arrow-down  size-10">
                <path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="m16 19 3 3 3-3"/><path d="M18 12h.01"/><path d="M19 16v6"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/>
              </svg>
            </div>
            <div>
                <div class="text-sm text-gray-400 ">購入合計</div>
                <div class="flex items-center pt-1">
                    <div id="total-buy-amount" class="text-xl font-medium text-black-400">￥ 1,375</div>
                </div>
            </div>
          </div>
          <div class="flex items-center justify-between p-5 bg-white rounded shadow-sm">
            <div class="text-red-400 mr-5">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-banknote-arrow-up-icon lucide-banknote-arrow-up size-10"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="M18 12h.01"/><path d="M19 22v-6"/><path d="m22 19-3-3-3 3"/><path d="M6 12h.01"/>
                <circle cx="12" cy="12" r="2"/>
              </svg>
            </div>
            <div>
                <div class="text-sm text-gray-400 ">売却合計</div>
                <div class="flex items-center pt-1">
                    <div id="total-sell-amount" class="text-xl font-medium text-black-400">￥ 1,375</div>
                </div>
            </div>
          </div>
        </div>
        <div class="table-area">
          <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
            <table id="trade-list-table" class="table">
              <!-- head -->
              <thead class="bg-gray-200">
                <tr>
                  <th></th>
                  <th>銘柄名</th>
                  <th>数量</th>
                  <th>単価</th>
                  <th>手数料</th>
                  <th>概算金額</th>
                  <th>種類</th>
                  <th>取引日</th>
                  <th>購入理由・売却理由</th>
                  <th>メモ</th>
                </tr>
              </thead>
              <tbody id="trade-list-body">
              </tbody>
            </table>
          </div>
        </div>
      </div>
        <dialog id="regist-trade-dialog" class="modal">
          <div id="loading-layer" class="fixed inset-0 z-50 flex items-center justify-center hidden">
            <span class="loading loading-spinner loading-lg text-primary"></span>
          </div>
          <div class="modal-box max-w-2xl bg-base-200">
            <form id="regist-trade-form">
                <div class="flex gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.1" stroke="DeepSkyBlue" class="size-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                  </svg>
                  <span>取引登録</span>
                  <div class="divider divider-neutral"></div>
                </div>
              <div class="grid grid-cols-2 gap-12 rounded-xl shadow-lg p-8">
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">銘柄名<span class="text-red-300">（必須）</span></span>
                  </label>
                  <input
                    id="trade-name"
                    type="text"
                    placeholder="銘柄名"
                    class="input input-bordered w-full"
                    name="stockName"
                    required
                  />
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">取引種類<span class="text-red-300">（必須）</span></span>
                  </label>
                  <div class="grid grid-cols-2 gap-6">
                    <button class="btn btn-accent " id="buy-trade-btn" type="button">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941" />
                      </svg>
                      購入
                    </button>
                    <button class="btn btn-error" id="sell-trade-btn" type="button">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6 9 12.75l4.286-4.286a11.948 11.948 0 0 1 4.306 6.43l.776 2.898m0 0 3.182-5.511m-3.182 5.51-5.511-3.181" />
                      </svg>
                      売却
                    </button>
                  </div>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">取引日<span class="text-red-300">（必須）</span></span>
                  </label>
                  <input type="date" id="trade-date" name="tradeDate" required/>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">数量<span class="text-red-300">（必須）</span></span>
                  </label>
                  <input type="text" id="quantity" placeholder="数量" class="input input-bordered w-full max-w-xs" name="quantity" required/>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">単価<span class="text-red-300">（必須）</span></span>
                  </label>
                  <input type="text" id="unit-price" placeholder="単価" class="input input-bordered w-full max-w-xs" name="unitPrice" required/>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">手数料</span>
                  </label>
                  <input type="text" id="fee" placeholder="手数料" class="input input-bordered w-full max-w-xs" name="fee"/>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">購入理由・売却理由</span>
                  </label>
                  <textarea id="reason" class="textarea" placeholder="購入理由・売却理由" name="reason"></textarea>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text" >メモ</span>
                  </label>
                  <textarea id="memo" class="textarea" placeholder="メモ" name="memo"></textarea>
                </div>
                <div class="col-span-2 flex gap-2">
                  <button class="btn btn-success flex-1" id="regist-trade-btn">登録</button>
                  <button class="btn btn-success flex-1" id="update-trade-btn">更新</button>
                  <button class="btn btn-error flex-1" id="delete-trade-btn">削除</button>
                  <button class="btn bg-base-100 flex-1" id="close-trade-btn" type="button">キャンセル</button>
                </div>
              </div>
            </form>
          </div>
        </dialog>
      <script type="module" src="/src/main.ts"></script>
    </main>
  </body>
</html>
