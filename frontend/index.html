<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investment Journal</title>
  </head>
  <body>
    <header>
      <h1>Investment Journal</h1>
    </header>
    <main>
      <div id="app">
        <button id="regist-trade-btn" class="btn btn-outline btn-accent">取引登録</button>
      </div>
        <dialog id="regist-trade-dialog" class="modal">
          <div class="modal-box max-w-2xl bg-base-200">
                <div class="flex gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.1" stroke="DeepSkyBlue" class="size-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                  </svg>
                  <span>取引登録</span>
                  <div class="divider divider-neutral"></div>
                </div>
              <div class="grid grid-cols-2 gap-12 bg-white rounded-xl shadow-lg p-8">
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">銘柄名<span class="text-red-300">（必須）</span></span>
                  </label>
                  <input
                    type="text"
                    placeholder="銘柄名"
                    class="input input-bordered w-full"
                  />
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">取引種類<span class="text-red-300">（必須）</span></span>
                  </label>
                  <div class="grid grid-cols-2 gap-6">
                    <button class="btn btn-accent">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941" />
                      </svg>
                      購入
                    </button>
                    <button class="btn btn-error">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6 9 12.75l4.286-4.286a11.948 11.948 0 0 1 4.306 6.43l.776 2.898m0 0 3.182-5.511m-3.182 5.51-5.511-3.181" />
                      </svg>
                      売却
                    </button>
                  </div>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">取引日<span class="text-red-300">（必須）</span></span>
                  </label>
                  <input type="date" />
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">数量<span class="text-red-300">（必須）</span></span>
                  </label>
                  <input type="text" placeholder="数量" class="input input-bordered w-full max-w-xs" />
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">単価<span class="text-red-300">（必須）</span></span>
                  </label>
                  <input type="text" placeholder="単価" class="input input-bordered w-full max-w-xs" />
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">手数料</span>
                  </label>
                  <input type="text" placeholder="手数料" class="input input-bordered w-full max-w-xs" />
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">購入理由・売却理由</span>
                  </label>
                  <textarea class="textarea" placeholder="購入理由・売却理由"></textarea>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="label">
                    <span class="label-text">メモ</span>
                  </label>
                  <textarea class="textarea" placeholder="メモ"></textarea>
                </div>
                <button class="btn btn-success">登録</button>
                <button class="btn">キャンセル</button>
              </div>
          </div>
        </dialog>
      <script type="module" src="/src/main.ts"></script>
    </main>
  </body>
</html>
